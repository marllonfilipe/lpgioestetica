[build]
command = "npm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NITRO_PRESET = "netlify"

[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Pragma = "no-cache"
Expires = "0"

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/politica-de-privacidade"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/termos-de-uso"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/api/*"

[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Store photos locally, but validate them on every new visit so replacements
# at the same URL do not leave the landing page showing an outdated image.
[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
