[build]
command = "npm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "22"
NITRO_PRESET = "netlify"

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"
Pragma = "no-cache"
Expires = "0"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
